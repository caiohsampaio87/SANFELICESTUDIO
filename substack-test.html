<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newsletter Signup Test | Sanfelice Studio</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="substack-test-page">
  <section class="substack-embed">
    <div class="substack-embed__layout">
      <svg class="substack-embed__logo" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M22.539 8.242H1.46V5.406h21.08v2.836z"/>
        <path d="M1.46 10.812V24L12 18.11 22.54 24V10.812H1.46z"/>
        <path d="M22.54 0H1.46v2.836h21.08V0z"/>
      </svg>
      <div class="substack-embed__content">
        <form class="substack-embed__form" action="https://caiosanfelice.substack.com/api/v1/free?nojs=true" method="POST">
          <label class="substack-embed__visually-hidden" for="substack-email">Email address</label>
          <input id="substack-email" type="email" name="email" autocomplete="email" spellcheck="false" placeholder="Type your email..." required>
          <button type="submit">Subscribe</button>
        </form>
        <p class="substack-embed__message" role="status" aria-live="polite" hidden></p>
      </div>
    </div>
    <p class="substack-embed__legal">
      By subscribing you agree to Substack's
      <a href="https://substack.com/tos">Terms of Use</a>, our
      <a href="https://substack.com/privacy">Privacy Policy</a> and our
      <a href="https://substack.com/information-collection-notice">Information collection notice</a>
    </p>
  </section>
  <script>
    const form = document.querySelector('.substack-embed__form');
    const button = form.querySelector('button');
    const message = document.querySelector('.substack-embed__message');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      button.textContent = 'Subscribing...';
      message.hidden = true;
      let response;
      try {
        response = await fetch('https://caiosanfelice.substack.com/api/v1/free', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: form.elements.email.value })
        });
      } catch (error) {
        console.error('Substack signup failed:', error);
      }
      if (response?.ok) {
        form.hidden = true;
        message.className = 'substack-embed__message is-success';
        message.textContent = "You're subscribed! Check your inbox.";
      } else {
        if (response) console.error('Substack HTTP error:', response.status);
        button.disabled = false;
        button.textContent = 'Subscribe';
        message.className = 'substack-embed__message is-error';
        message.textContent = 'Something went wrong — please try again.';
      }
      message.hidden = false;
    });
  </script>
</body>
</html>
